name: Build StudyAI APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Extract project
        run: |
          unzip -q "./StudyAI_Android_Project-1.zip" -d project

          PROJECT_DIR=$(find project -name "settings.gradle.kts" -exec dirname {} \; | head -1)

          echo "Project folder: $PROJECT_DIR"

          cd "$PROJECT_DIR"

          gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyAI-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
